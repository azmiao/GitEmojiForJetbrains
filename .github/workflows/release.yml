name: Release GitEmojiForJetbrains

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and project version
        id: validate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "仅支持 vX.Y.Z 格式的正式版本标签，当前标签：$tag" >&2
            exit 1
          fi

          version="${tag#v}"
          project_version="$(grep -E '^pluginVersion\s*=' gradle.properties | sed -E 's/^pluginVersion\s*=\s*//' | tr -d '[:space:]')"
          if [[ "$version" != "$project_version" ]]; then
            echo "标签版本 $version 与 gradle.properties 中 pluginVersion=$project_version 不一致" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build plugin zip
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin distribution
        run: ./gradlew buildPlugin

      - name: Locate plugin zip
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          zip_path="$(ls build/distributions/*.zip | head -n1)"
          echo "path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitEmojiForJetbrains-Plugin
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  changelog:
    name: Generate changelog
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate release notes and full changelog
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          git show "$RELEASE_TAG:scripts/generate_changelog.py" > "$RUNNER_TEMP/generate_changelog.py"
          python "$RUNNER_TEMP/generate_changelog.py" --tag "$RELEASE_TAG" > release-notes.md
          python "$RUNNER_TEMP/generate_changelog.py" --all --output CHANGELOG.md
          test -s release-notes.md
          test -s CHANGELOG.md

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Commit changelog
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新 CHANGELOG"
          git push origin "HEAD:$DEFAULT_BRANCH"

  release:
    name: Publish GitHub Release
    needs: [metadata, build, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: GitEmojiForJetbrains-Plugin
          path: assets/plugin

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: assets/metadata

      - name: Verify assets
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/metadata/release-notes.md
          plugin_zip="$(ls assets/plugin/*.zip | head -n1)"
          test -s "$plugin_zip"
          echo "PLUGIN_ZIP=$plugin_zip" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: ${{ needs.metadata.outputs.tag }}
          body_path: assets/metadata/release-notes.md
          files: ${{ env.PLUGIN_ZIP }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
