name: Build Plugin Zip

env:
  TZ: Asia/Shanghai

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin distribution
        run: gradle buildPlugin -Dorg.gradle.java.home=$JAVA_HOME

      - name: Locate plugin zip
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          zip_path="$(ls build/distributions/*.zip | head -n1)"
          echo "path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$zip_path")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitEmojiForJetbrains-Plugin
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error
