name: Publish to JetBrains Marketplace

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签 (如 v1.0.0)'
        required: true
        type: string
      channel:
        description: '发布渠道'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - alpha

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

jobs:
  metadata:
    name: Validate publish metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      channel: ${{ steps.validate.outputs.channel }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and project version
        id: validate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "仅支持 vX.Y.Z 格式的正式版本标签，当前标签：$tag" >&2
            exit 1
          fi

          version="${tag#v}"
          project_version="$(grep -E '^pluginVersion\s*=' gradle.properties | sed -E 's/^pluginVersion\s*=\s*//' | tr -d '[:space:]')"
          if [[ "$version" != "$project_version" ]]; then
            echo "标签版本 $version 与 gradle.properties 中 pluginVersion=$project_version 不一致" >&2
            exit 1
          fi

          channel="${INPUT_CHANNEL:-stable}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish to Marketplace
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          # 生成 changelog 需要完整 git 历史与标签
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate release notes for Marketplace What's New
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          # 用打标签时点的脚本生成本版本的发布说明，与 GitHub Release 保持同一来源
          python scripts/generate_changelog.py --tag "$RELEASE_TAG" > release-notes.md
          test -s release-notes.md

      - name: Setup Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Verify plugin structure
        run: gradle verifyPluginStructure -Dorg.gradle.java.home=$JAVA_HOME -PreleaseNotesFile=release-notes.md

      - name: Publish to JetBrains Marketplace
        run: gradle publishPlugin -Dorg.gradle.java.home=$JAVA_HOME -PpublishChannels=${{ needs.metadata.outputs.channel }} -PreleaseNotesFile=release-notes.md
